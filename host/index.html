<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badgeware WASM simulator</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 1rem;
    font: 14px/1.5 system-ui, sans-serif; background: #14151a; color: #d6d8de;
    text-align: center;
  }
  h1 { font-size: 1rem; font-weight: 600; margin: 0; color: #9aa0ac; }
  #screen {
    width: 640px; height: 480px; background: #000; border-radius: 8px;
    image-rendering: pixelated; box-shadow: 0 8px 40px rgba(0,0,0,.5);
  }
  kbd {
    background: #262832; border: 1px solid #363a46; border-radius: 4px;
    padding: 1px 6px; font-family: ui-monospace, monospace; font-size: 12px;
  }
  #status { color: #7f8592; min-height: 1.2em; }

  /* Case lights: four PWM zones (CL0..CL3) that light the case from behind.
     Drawn as soft glows behind the screen corners; see sim_pwm_set for the
     duty -> opacity curve. */
  #badge { position: relative; isolation: isolate; }
  #badge canvas { position: relative; z-index: 1; display: block; }
  .glow {
    position: absolute; width: 360px; height: 300px; z-index: 0;
    border-radius: 50%; pointer-events: none; opacity: 0;
    background: radial-gradient(closest-side, rgba(255,240,224,.9), rgba(255,240,224,0));
    filter: blur(24px); transition: opacity 60ms linear;
  }
  /* Same order as the IDE's 3D case-light fallback positions. */
  .glow[data-cl="0"] { left: -120px;  top: -100px; }
  .glow[data-cl="1"] { left: -120px;  bottom: -100px; }
  .glow[data-cl="2"] { right: -120px; top: -100px; }
  .glow[data-cl="3"] { right: -120px; bottom: -100px; }
  #lights { color: #6b7080; font-variant-numeric: tabular-nums; }
  .hint { color: #6b7080; }
</style>
</head>
<body>
  <h1 id="board">Badgeware WASM simulator</h1>
  <div id="badge">
    <div class="glow" data-cl="0"></div><div class="glow" data-cl="1"></div>
    <div class="glow" data-cl="2"></div><div class="glow" data-cl="3"></div>
    <canvas id="screen" width="640" height="480"></canvas>
  </div>
  <div id="status">loading MicroPython...</div>
  <div class="hint">
    buttons: <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> &middot;
    <kbd>&uarr;</kbd> <kbd>&darr;</kbd> &middot; <kbd>H</kbd> home
  </div>
  <div id="lights">case lights: 0% 0% 0% 0%</div>

<script type="module">
import { loadMicroPython } from "./micropython.mjs";

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
const status = document.getElementById("status");

// Offscreen canvas at the framebuffer's native resolution; we scale it up to
// the visible canvas with nearest-neighbour so the pixels stay crisp.
const off = document.createElement("canvas");
const offctx = off.getContext("2d");

// --- host contract: the simulator's st7789.update() calls this -------------
// It hands us the address of its RGBA framebuffer in the wasm heap (plus the
// current width/height); we read the bytes directly - zero copy on the Python
// side - and paint the canvas.
globalThis.blitrgba = (addr, w, h) => {
  const heap = globalThis.Module.HEAPU8;
  // Copy out of the wasm heap (its buffer can move if memory grows).
  const pixels = new Uint8ClampedArray(heap.subarray(addr, addr + w * h * 4));
  if (off.width !== w || off.height !== h) { off.width = w; off.height = h; }
  offctx.putImageData(new ImageData(pixels, w, h), 0, 0);
  ctx.drawImage(off, 0, 0, w, h, 0, 0, canvas.width, canvas.height);
};

// backlight(0..1) - visualised by dimming the canvas.
globalThis.backlight = (v) => { canvas.style.filter = `brightness(${Math.max(0.15, v)})`; };

// --- host contract: case lights ---------------------------------------------
// machine.PWM.duty_u16() calls sim_pwm_set(gpio, freq, duty). GPIO 0..3 are the
// case-light channels CL0..CL3; other PWM channels have no visible effect here.
// The LEDs' light output is proportional to duty, but CSS opacity behaves like a
// gamma-encoded (sRGB) value, so encode the duty before using it as opacity.
// badge.caselights() already applies a 2.2 gamma to the duty, so
// caselights(0.5) -> duty ~22% -> opacity ~50%, about half as bright as full,
// as on the badge. The status line shows the raw duty.
const SRGB_GAMMA = 2.2;
const glows = [...document.querySelectorAll(".glow")];
const lights = [0, 0, 0, 0];
const lightsText = document.getElementById("lights");
globalThis.sim_pwm_set = (gpio, freq, duty) => {
  if (gpio < 0 || gpio > 3) return;
  const v = Math.max(0, Math.min(65535, duty)) / 65535;
  if (v === lights[gpio]) return;
  lights[gpio] = v;
  glows[gpio].style.opacity = Math.pow(v, 1 / SRGB_GAMMA);
  lightsText.textContent = "case lights: " +
    lights.map((l) => Math.round(l * 100) + "%").join(" ");
};

// --- host contract: buttons -------------------------------------------------
// machine.py / picovector_io read this as an active-high pressed bitmask.
const BUTTON = { HOME: 0x20, A: 0x10, B: 0x08, C: 0x04, UP: 0x02, DOWN: 0x01 };
const KEYS = {
  "a": BUTTON.A, "b": BUTTON.B, "c": BUTTON.C,
  "ArrowUp": BUTTON.UP, "ArrowDown": BUTTON.DOWN, "h": BUTTON.HOME,
};
let buttons = 0;
globalThis.sim_buttons = () => buttons;
addEventListener("keydown", (e) => {
  const b = KEYS[e.key];
  if (b !== undefined) { buttons |= b; e.preventDefault(); }
});
addEventListener("keyup", (e) => {
  const b = KEYS[e.key];
  if (b !== undefined) { buttons &= ~b; e.preventDefault(); }
});

// --- a small badgeware-style demo ------------------------------------------
// Board-agnostic: uses whichever display driver this build froze (Tufty ST7789,
// Badger SSD1680 or Blinky), and scales to that display's resolution.
const DEMO = `
import picovector, machine, math
color = picovector.color

# Button input: the current builds freeze _input (held = board Pins); older
# builds had picovector_io (held = button bits).
try:
    import _input as io
    BTN_A, BTN_UP, BTN_DOWN = (machine.Pin.board.BUTTON_A,
                               machine.Pin.board.BUTTON_UP,
                               machine.Pin.board.BUTTON_DOWN)
except ImportError:
    import picovector_io as io
    BTN_A, BTN_UP, BTN_DOWN = io.BUTTON_A, io.BUTTON_UP, io.BUTTON_DOWN

# Case lights CL0..CL3, driven the same way badgeware's badge.py does it.
caselights = [machine.PWM(getattr(machine.Pin.board, "CL%d" % i)) for i in range(4)]
for cl in caselights:
    cl.freq(1000)
ORDER = (0, 1, 3, 2)   # chase order round the case: CL0, CL1, CL3, CL2

display = None
for _mod, _cls in (("st7789", "ST7789"), ("ssd1680", "SSD1680"), ("blinky", "Blinky")):
    try:
        display = getattr(__import__(_mod), _cls)()
        break
    except ImportError:
        pass

if hasattr(display, "fullres"):
    display.fullres(True)                   # Tufty: 320x240 hires

W, H = display.WIDTH, display.HEIGHT
img = picovector.image(W, H, memoryview(display))

size = max(4, min(W, H) // 4)
frame = 0
x, y = 1.0, 1.0
dx, dy = max(1.0, W / 100), max(1.0, H / 120)

while True:
    io.poll()
    held = io.held

    x += dx; y += dy
    if x < 0 or x + size > W: dx = -dx; x += dx
    if y < 0 or y + size > H: dy = -dy; y += dy

    img.pen = color.black
    img.clear()
    # A/B/C tint the square; the D-pad nudges it.
    img.pen = color.green if held else color.red
    if BTN_UP in held:    y = max(0, y - dy * 2)
    if BTN_DOWN in held:  y = min(H - size, y + dy * 2)
    img.rectangle(int(x), int(y), size, size)
    display.update()

    # Chase a glow around the four case-light zones; hold A for all on.
    frame += 1
    for i, cl in enumerate(caselights):
        if BTN_A in held:
            level = 1.0
        else:
            level = max(0.0, math.sin(frame / 12 - ORDER[i] * math.pi / 2))
        cl.duty_u16(int(level * 65535))
`;

const mp = await loadMicroPython();

// Name the page after the board this build is for (os.uname().machine ->
// "Pimoroni <Board> 2350 with RP2350"). Python hands it out via a JS global.
try {
  mp.runPython("import js, os\njs.globalThis.__badge_machine = os.uname().machine");
  const machine = String(globalThis.__badge_machine || "");
  const name = machine.split(" with ")[0];
  if (name) {
    document.getElementById("board").textContent = name + " simulator";
    document.title = name + " - Badgeware WASM";
  }
} catch (_) { /* leave the default heading */ }

status.textContent = "running";
try {
  await mp.runPythonAsync(DEMO);
} catch (e) {
  status.textContent = "stopped: " + e;
  console.error(e);
}
</script>
</body>
</html>
