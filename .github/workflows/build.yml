name: build

# Build the badgeware-tufty2350 simulator for the suspend-capable async
# backends and publish each micropython.mjs / .wasm pair as an artifact.
#
# The batteries-included build is also attached to a release, as one zip, so
# another repository's CI can fetch a pinned copy without a build of its own.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [tufty2350, badger2350, blinky2350]
        # The async backend (see variants/badgeware_common.cmake).
        async: [asyncify, jspi]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Only the submodules this build needs, rather than a full recursive
      # clone of MicroPython's many submodules.
      - name: Init submodules
        run: |
          git submodule update --init micropython picovector-micropython
          git -C picovector-micropython submodule update --init
          git -C micropython submodule update --init lib/micropython-lib

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          # Pinned for reproducibility; matches the toolchain the port is
          # developed against. The suspend-capable variants (asyncify-fast,
          # jspi) need a recent emscripten (JSPI, -fwasm-exceptions).
          version: 6.0.0

      - name: Build mpy-cross
        run: make -C micropython/mpy-cross -j$(nproc)

      - name: Configure
        run: |
          emcmake cmake -B build -S micropython/ports/webassembly \
            -DMICROPY_VARIANT_DIR=$PWD/variants/badgeware-${{ matrix.board }} \
            -DBADGEWARE_ASYNC=${{ matrix.async }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: badgeware-${{ matrix.board }}-${{ matrix.async }}
          path: |
            build/micropython.mjs
            build/micropython.wasm
          if-no-files-found: error

  # The runtime frozen in, for a caller that wants to run a badge app with nothing
  # staged around it. A job of its own and not a matrix entry: it freezes the firmware's
  # own badgeware package and fonts, so it needs a checkout of that too, and JSPI is the
  # only backend worth building it for.
  batteries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the build to a release

    env:
      NAME: badgeware-tufty2350-batteries-jspi

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout the firmware, for the runtime and the fonts
        uses: actions/checkout@v7
        with:
          repository: pimoroni/tufty2350
          ref: feature/align-v3
          path: firmware

      - name: Init submodules
        run: |
          git submodule update --init micropython picovector-micropython
          git -C picovector-micropython submodule update --init
          git -C micropython submodule update --init lib/micropython-lib

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.0

      - name: Build mpy-cross
        run: make -C micropython/mpy-cross -j$(nproc)

      - name: Configure
        run: |
          emcmake cmake -B build -S micropython/ports/webassembly \
            -DMICROPY_VARIANT_DIR=$PWD/variants/badgeware-tufty2350-batteries \
            -DBADGEWARE_FIRMWARE_DIR=$PWD/firmware \
            -DBADGEWARE_ASYNC=jspi

      - name: Build
        run: cmake --build build -j$(nproc)

      # It is meant to run with nothing staged, so this is the check that it does.
      - name: Import the runtime and draw a frame
        run: node tools/smoke.mjs build/micropython.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: |
            build/micropython.mjs
            build/micropython.wasm
          if-no-files-found: error

      # As one zip, and with the filenames kept: the generated micropython.mjs locates
      # its wasm by name in its own directory, so the pair travels together or the
      # caller has to pass `url` to loadMicroPython to put it right.
      - name: Zip it
        if: github.event_name == 'release'
        run: |
          cp build/micropython.mjs build/micropython.wasm .
          zip "$NAME.zip" micropython.mjs micropython.wasm
          unzip -l "$NAME.zip"

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.NAME }}.zip
